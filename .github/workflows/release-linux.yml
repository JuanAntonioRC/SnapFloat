name: Build and Release deb + snap (Linux)

on:
  push:
    tags:
      - 'linux-v*'  # Triggers on tags like linux-v1.3

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#linux-v}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: ./scripts/setup-linux-deps.sh

      - name: Build deb
        run: |
          # setup-linux-deps.sh skips swiftly when the runner image already
          # ships a Swift toolchain, so there's no env.sh to source then.
          SWIFTLY_ENV="${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          if [ -f "$SWIFTLY_ENV" ]; then source "$SWIFTLY_ENV"; fi
          VERSION="${{ steps.version.outputs.VERSION }}" ./scripts/build-deb.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SnapFloat Linux ${{ steps.version.outputs.VERSION }}
          # README's macOS download link is /releases/latest — keep that
          # pointing at the DMG; install.sh finds Linux releases itself.
          make_latest: false
          draft: false
          generate_release_notes: true
          files: dist/snapfloat_${{ steps.version.outputs.VERSION }}_amd64.deb

  # The .snap is what install.sh fetches — the one-line install path.
  # Separate job so a failure in either build doesn't block the other.
  # Runs after `build` (not alongside it) so the two jobs don't race to
  # create the same release (if `build` failed, this job creates it).
  snap:
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ !cancelled() }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#linux-v}" >> "$GITHUB_OUTPUT"

      # snapcraft.yaml's `version:` is a fallback for local builds — the
      # tag is the source of truth for releases.
      - name: Stamp version from tag
        run: |
          sed -i "s/^version: .*/version: '${{ steps.version.outputs.VERSION }}'/" snap/snapcraft.yaml

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@v1

      # install.sh picks the newest release with a *.snap asset, so the
      # file name only needs the .snap extension — keep it versioned.
      - name: Attach snap to the release
        uses: softprops/action-gh-release@v2
        with:
          name: SnapFloat Linux ${{ steps.version.outputs.VERSION }}
          make_latest: false
          files: ${{ steps.snapcraft.outputs.snap }}
